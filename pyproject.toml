[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fetalbio"
version = "1.0.0"
description = "Circumference-constrained landmark decoding for domain-robust fetal ultrasound biometry"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy", "pandas", "scipy", "scikit-learn",
                "statsmodels", "opencv-python-headless", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
